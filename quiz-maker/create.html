<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="quiz-bg">
  <div class="quiz-container">
    <h2 class="main-title">✍️ Create a New Quiz</h2>
    <form id="quizForm">
      <input type="text" id="quizTitle" placeholder="Quiz Title" required><br><br>
      <div id="questionsContainer"></div>
      <button type="button" class="next-btn" onclick="addQuestionForm()">➕ Add Question</button><br><br>
      <button type="submit" class="next-btn">💾 Save Quiz</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
